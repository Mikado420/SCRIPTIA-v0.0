<!doctype html>
<html lang="ja">
  <head>
    <script>
      window.addEventListener('error', function(event) {
        var box = document.getElementById('runtime-error-overlay');
        if (!box) {
          box = document.createElement('div');
          box.id = 'runtime-error-overlay';
          box.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:#200;color:#ff8888;padding:24px;z-index:999999;font-family:monospace;font-size:14px;overflow:auto;white-space:pre-wrap;';
          document.body ? document.body.appendChild(box) : document.documentElement.appendChild(box);
        }
        box.innerText += '[CRITICAL ERROR]: ' + event.message + '\nFile: ' + event.filename + ':' + event.lineno + '\n\n';
      });
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
