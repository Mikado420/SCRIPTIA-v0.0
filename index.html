<!doctype html>
<html lang="ja">
  <head>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('debug-error-box');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-error-box';
          el.style = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#880000;color:#fff;padding:20px;z-index:999999;font-family:monospace;white-space:pre-wrap;overflow:auto;font-size:14px;';
          document.body.appendChild(el);
        }
        el.innerText += 'CRITICAL ERROR:\n' + e.message + '\nAt: ' + e.filename + ':' + e.lineno + '\n\n';
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
